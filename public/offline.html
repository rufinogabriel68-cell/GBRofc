<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GBR Gestão — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090b;color:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .c{text-align:center;padding:24px;max-width:340px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:20px;margin:16px 0 6px}
  p{color:#a9b0bc;font-size:14px;line-height:1.5}
  button{margin-top:16px;height:40px;padding:0 18px;border-radius:12px;border:0;font-weight:700;background:linear-gradient(135deg,#38a8ff,#21e0c0);color:#03121e}
</style>
</head>
<body>
  <div class="c">
    <img src="/icons/icon-192.png" alt="GBR" />
    <h1>Você está offline</h1>
    <p>Os dados já carregados continuam disponíveis e as alterações serão sincronizadas quando a conexão voltar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
